apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: magazik-kafka
  namespace: kafka
spec:
  kafka:
    version: 3.8.0
    replicas: 1
    # Настройка слушателей (как клиенты будут подключаться)
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    # Конфигурация самого Kafka
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    # Хранилище (для разработки используем эфемерное, данные будут теряться при перезапуске)
    storage:
      type: ephemeral
  # Включаем Entity Operator, который позволит управлять темами и пользователями декларативно
  entityOperator:
    topicOperator: {}
    userOperator: {}
