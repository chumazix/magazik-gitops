apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/magazik-gitops.git
    targetRevision: HEAD
    path: infrastructure/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: cache
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
