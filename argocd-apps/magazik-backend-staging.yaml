apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magazik-backend-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/magazik-gitops.git
    targetRevision: HEAD
    path: apps/backend/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
