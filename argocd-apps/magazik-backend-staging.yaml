apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magazik-backend-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chumazix/magazik-app.git
    targetRevision: HEAD
    path: charts/magazik-backend
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: "latest"
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
