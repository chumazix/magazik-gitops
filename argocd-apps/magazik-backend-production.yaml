apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magazik-backend-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chumazix/magazik-gitops.git
    targetRevision: HEAD
    path: apps/backend/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
