apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magazik-frontend-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chumazix/magazik-gitops.git
    targetRevision: HEAD
    path: apps/frontend/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
